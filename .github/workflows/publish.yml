name: Publish

# Bumping `version` in pyproject.toml on master is the release. That push runs
# stk's checks with their dependency audit; only if they pass is it published,
# tagged and released. Nobody tags by hand, and a red commit cannot ship.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - id: v
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          # Checked before anything runs, so a missing entry never half-ships.
          awk -v h="## v$version" '$0 == h || index($0, h " ") == 1 {f=1; next} /^## /{if (f) exit} f' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no '## v$version' entry"; exit 1; }
      - if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  checks:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Only this job can mint the PyPI token, and it runs no project code.
  publish:
    needs: build
    if: github.repository == 'level09/stk'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: notes
      - name: Tag and release with the CHANGELOG entry as notes
        run: gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
