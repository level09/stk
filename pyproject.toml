[project]
name = "stkit"
version = "17.1.0"
description = "An async Quart framework optimized for AI-assisted development workflows"
authors = [
    {name = "Level09", email = "hello@level09.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.16.0",
    "aiosmtplib>=5.0.0",
    "aiosqlite>=0.20.0",
    "authlib>=1.9.1,<2",
    "bcrypt>=4.3.0",
    "blinker>=1.9.0",
    "click>=8.3.1",
    "cryptography>=45.0.5",
    "email-validator>=2.2.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.1,<2",
    "libpass>=1.9.0",
    "orjson>=3.10.18",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "qrcode>=8.2",
    "quart>=0.20.0",
    "quart-security>=2.0.3,<3",
    "quart-session>=3.0.0",
    "rich>=14.0.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn>=0.40.0",
    "webauthn>=2.6.0",
    "wtforms>=3.2.1",
]


[project.urls]
Documentation = "https://docs.stkit.dev"
Source = "https://github.com/level09/stk"
Changelog = "https://github.com/level09/stk/blob/master/CHANGELOG.md"

[project.scripts]
stk = "stk.cli.main:main"

[project.optional-dependencies]
full = [
    "asyncpg>=0.30.0",
    "redis>=7.1.0",
]
dev = [
    "ruff",
    "pre-commit",
    "playwright",
    "ptpython>=3.0.30",
]
asgi = [
    "hypercorn>=0.17.0",
]

# The bundled example app, so stk's own repository runs as an app.
[tool.stk]
app = "minimal.app:app"
path = "examples/minimal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit so an app can rename the project without breaking the build.
[tool.hatch.build.targets.wheel]
packages = ["stk"]

# Listed, not walked: .claude/skills and .agents/skills link into the app template,
# and hatch keeps a linked file under only one path, dropping the template's copy.
[tool.hatch.build.targets.sdist]
only-include = ["stk", "tests", "examples", "CHANGELOG.md", "SECURITY.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "C901",   # complexity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["stk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
