services:

  redis:
    container_name: redis 
    image: 'redis:7-alpine'
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}

  postgres:
    container_name: postgres
    image: 'postgres:15-alpine'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
      - './postgres/init-db.sh:/docker-entrypoint-initdb.d/10-stk.sh:ro'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?Set a unique DB_ADMIN_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:?Set a unique DB_PASSWORD}
      - POSTGRES_DB=stk
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "stk"]
      interval: 5s
      timeout: 3s
      retries: 3

  website:
    container_name: website
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m stk db upgrade && exec uvicorn run:app --host 0.0.0.0 --port 5000 --ws-max-size 65536 --ws-max-queue 16 --proxy-headers --forwarded-allow-ips='*'"]
    env_file:
      - .env
    environment:
      - QUART_APP=run.py
      - QUART_DEBUG=0
      - STK_ENV=production
      - SESSION_COOKIE_SECURE=True
      - STK_PUBLIC_URL=https://${STK_HOST:?Set the public DNS name}
      - SECURITY_WAN_RP_ID=${STK_HOST:?Set the public DNS name}
      - SECURITY_WAN_EXPECTED_ORIGIN=https://${STK_HOST:?Set the public DNS name}
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://stk:${DB_PASSWORD:?Set a unique DB_PASSWORD}@postgres/stk
      - REDIS_SESSION=redis://:${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}@redis:6379/1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    container_name: nginx
    restart: always
    image: 'nginx:alpine'
    user: "${DOCKER_UID:-1000}"
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - './stk/static/:/app/static/:ro'
      - './nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
      - './nginx/stk.conf:/etc/nginx/conf.d/default.conf:ro'
      - '${TLS_CERTIFICATE:?Set the TLS certificate path}:/etc/nginx/tls/fullchain.pem:ro'
      - '${TLS_PRIVATE_KEY:?Set the TLS key path}:/etc/nginx/tls/key.pem:ro'
    tmpfs:
      - /tmp:exec
      - /var/run
      - /var/cache/nginx
    depends_on:
      - website
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
