[project]
name = "minimal"
version = "0.1.0"
description = "Minimal, built on stk"
requires-python = ">=3.11"
dependencies = ["stk>=17.0.0,<18"]

[project.optional-dependencies]
full = ["stk[full]"]  # PostgreSQL and Redis

[dependency-groups]
dev = ["stk[dev]"]

[tool.uv.sources]
stk = { path = "../..", editable = true }

[tool.stk]
app = "minimal.app:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
