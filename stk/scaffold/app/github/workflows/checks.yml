name: Checks

on:
  push:
  pull_request:

env:
  SECRET_KEY: ci-only-secret-key-not-for-production
  SECURITY_PASSWORD_SALT: ci-only-password-salt-not-for-production
  # Production on PostgreSQL? Check on it too: with no URL here, every check and
  # smoke run uses SQLite, and a Postgres-only query passes CI and fails in production.
  # Uncomment this, the `services:` block below, and use `uv sync --extra full`.
  # SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://ci:ci@localhost:5432/ci

jobs:
  checks:
    runs-on: ubuntu-latest
    # services:
    #   postgres:
    #     image: postgres:17
    #     env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
    #     ports: ["5432:5432"]
    #     options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Migrate
        run: uv run stk db upgrade
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Verify (lint, sanity, migrations)
        run: uv run stk verify --json
      - name: Browser smoke (behavioral)
        run: uv run stk smoke --json
      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: .stk/smoke/
          if-no-files-found: ignore
