{% extends "layout.html" %}

{% block page_title %}{{ name }}{% endblock %}

{% block content %}
{# v-pre: a description can carry request text, which Vue would otherwise compile. #}
<div class="jumbotron" v-pre>
    <div class="text-center">
        <h1>{{ code }}</h1>
        <p>{{ description }}</p>
    </div>
</div>
{% endblock %}
